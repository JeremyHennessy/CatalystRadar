name: Validate paper-only application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified
      - run: python3 -m unittest discover -s backend -p 'test_*.py'
      - run: node --check web/collector-audit.js && node web/tests-collector-audit.js && node --check web/collectors.js && node web/tests-collectors.js && node --check web/financial-values.js && node web/tests-financial-values.js && node --check web/company-debt.js && node web/tests-company-debt.js && node --check web/research-queue.js && node web/tests-research-queue.js && node --check web/company-disclosures.js && node web/tests-company-disclosures.js && node --check web/company-investigation.js && node web/tests-company-investigation.js && node --check web/financial-review.js && node web/tests-financial-review.js && node --check web/insider-conflicts.js && node web/tests-insider-conflicts.js && node --check web/insider-review.js && node web/tests-insider-review.js && node --check web/company-loss.js && node --check web/company-ieh.js && node web/tests-company-ieh.js && node web/tests-company-loss.js && node --check web/company.js && node web/tests-company.js && node --check web/disclosures.js && node web/tests-disclosures.js && node --check web/issuer-explorer.js && node web/tests-issuer-explorer.js && node --check web/overview.js && node web/tests-overview.js && node --check web/app.js && node web/tests-ui.js && node --check web/datasets.js && node web/tests-datasets.js && node --check web/holdings.js && node web/tests-holdings.js && node --check web/formd.js && node web/tests-formd.js && node --check web/smalloffers.js && node web/tests-smalloffers.js
      - run: python3 backend/verify_public_state.py
