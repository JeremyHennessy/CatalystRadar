name: Validate paper-only application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified
      - run: python3 -m unittest discover -s backend -p 'test_*.py'
      - run: node --check web/app.js && node web/tests-ui.js && node --check web/datasets.js && node web/tests-datasets.js && node --check web/holdings.js && node web/tests-holdings.js && node --check web/formd.js && node web/tests-formd.js && node --check web/smalloffers.js && node web/tests-smalloffers.js && node --check web/financial-history.js && node web/tests-financial-history.js
      - run: python3 backend/verify_public_state.py
