name: Trial-week SEC observations (no trading)
on:
  schedule:
    - cron: '17,47 11-23 16-20 11 *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sec-observation-snapshot
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified
        with:
          ref: main
      - id: gate
        run: echo "allowed=$(python3 backend/trial_gate.py)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.allowed == 'true'
        run: |
          python3 -m unittest discover -s backend -p 'test_*.py'
          python3 backend/scan_watchlist.py
          python3 backend/build_dashboard.py --preserve-research-report
          python3 backend/verify_public_state.py
          node --check web/app.js && node web/tests-ui.js
      - if: steps.gate.outputs.allowed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/sec-observations/*.json data/latest_scan.json data/sec-snapshots web/app-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public SEC observation snapshot (paper-only)'
          git push origin HEAD:main
      # GITHUB_TOKEN pushes do not trigger Pages. Rebuild explicitly, including
      # unchanged snapshots so a prior failed publication can recover.
      - if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 backend/publish_observations.py
